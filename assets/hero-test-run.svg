<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">MK Jaswanth — QA Engineer profile as a passing test run</title>
  <desc id="description">A profile header for MK Jaswanth, QA Engineer and SDET. A pytest run plays on the right: six profile checks pass, covering his QA role, ERP and POS testing, BugAura Labs, QA Lab, bug finding, and openness to SDET roles.</desc>

  <defs>
    <clipPath id="typing">
      <rect x="604" y="94" width="345" height="26">
        <animate attributeName="width" values="0;0;345;345;0;0" keyTimes="0;0.02;0.1;0.95;0.975;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Paper and accent -->
  <rect width="1200" height="480" fill="#f3efe6"/>
  <rect width="14" height="480" fill="#df4b55"/>

  <!-- Identity -->
  <g fill="#17191c">
    <text x="64" y="66" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2.4">PROFILE / TEST REPORT</text>
    <text x="62" y="142" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="-1.5">MK JASWANTH</text>
    <text x="64" y="178" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">QA ENGINEER / SDET / AUTOMATION</text>

    <line x1="64" y1="206" x2="540" y2="206" stroke="#17191c" stroke-width="1.5"/>

    <g font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700">
      <text x="64" y="258">I turn product risk</text>
      <text x="64" y="298">into test coverage</text>
      <text x="64" y="338">and clear evidence.</text>
    </g>
    <text x="64" y="378" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.1" fill="#62636a">PLAYWRIGHT · PYTEST · API · LLM EVALUATION</text>

    <rect x="64" y="404" width="262" height="38" fill="none" stroke="#17191c" stroke-width="1.5"/>
    <rect x="64" y="404" width="6" height="38" fill="#df4b55"/>
    <text x="198" y="428" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.1">OPEN TO QA / SDET ROLES</text>
  </g>

  <!-- Test runner panel -->
  <rect x="584" y="40" width="552" height="402" fill="#17191c"/>
  <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="608" y="68" font-size="11" letter-spacing="1.6" fill="#8d8a83">TEST RUN · COIMBATORE, IN</text>
    <text x="1112" y="68" font-size="11" letter-spacing="1.6" fill="#8d8a83" text-anchor="end">PYTHON 3 · PLAYWRIGHT</text>
    <line x1="584" y1="82" x2="1136" y2="82" stroke="#34363b" stroke-width="1"/>

    <!-- Command, typed in -->
    <g clip-path="url(#typing)">
      <text x="608" y="112" fill="#e9e4d8"><tspan fill="#df4b55">$</tspan> pytest profile/test_mk_jaswanth.py -v</text>
    </g>

    <text x="608" y="142" fill="#8d8a83">collected 6 items
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1375;0.15;0.95;0.975;1" dur="16s" repeatCount="indefinite"/>
    </text>

    <!-- Each check: name first, then result -->
    <g fill="#e9e4d8">
      <text x="608" y="182">test_role_is_qa_engineer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1875;0.2;0.95;0.975;1" dur="16s" repeatCount="indefinite"/></text>
      <text x="948" y="182"><tspan fill="#4ec27a" font-weight="700">PASSED</tspan><tspan x="1112" text-anchor="end" fill="#8d8a83">[ 16%]</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.209375;0.221875;0.95;0.975;1" dur="16s" repeatCount="indefinite"/></text>

      <text x="608" y="210">test_tests_erp_and_pos_systems<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23125;0.24375;0.95;0.975;1" dur="16s" repeatCount="indefinite"/></text>
      <text x="948" y="210"><tspan fill="#4ec27a" font-weight="700">PASSED</tspan><tspan x="1112" text-anchor="end" fill="#8d8a83">[ 33%]</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.253125;0.265625;0.95;0.975;1" dur="16s" repeatCount="indefinite"/></text>

      <text x="608" y="238">test_runs_bugaura_labs<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.275;0.2875;0.95;0.975;1" dur="16s" repeatCount="indefinite"/></text>
      <text x="948" y="238"><tspan fill="#4ec27a" font-weight="700">PASSED</tspan><tspan x="1112" text-anchor="end" fill="#8d8a83">[ 50%]</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.296875;0.309375;0.95;0.975;1" dur="16s" repeatCount="indefinite"/></text>

      <text x="608" y="266">test_built_qa_lab<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31875;0.33125;0.95;0.975;1" dur="16s" repeatCount="indefinite"/></text>
      <text x="948" y="266"><tspan fill="#4ec27a" font-weight="700">PASSED</tspan><tspan x="1112" text-anchor="end" fill="#8d8a83">[ 66%]</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.340625;0.353125;0.95;0.975;1" dur="16s" repeatCount="indefinite"/></text>

      <text x="608" y="294">test_finds_bugs_before_users<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3625;0.375;0.95;0.975;1" dur="16s" repeatCount="indefinite"/></text>
      <text x="948" y="294"><tspan fill="#4ec27a" font-weight="700">PASSED</tspan><tspan x="1112" text-anchor="end" fill="#8d8a83">[ 83%]</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.384375;0.396875;0.95;0.975;1" dur="16s" repeatCount="indefinite"/></text>

      <text x="608" y="322">test_open_to_sdet_roles<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40625;0.41875;0.95;0.975;1" dur="16s" repeatCount="indefinite"/></text>
      <text x="948" y="322"><tspan fill="#4ec27a" font-weight="700">PASSED</tspan><tspan x="1112" text-anchor="end" fill="#8d8a83">[100%]</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.428125;0.440625;0.95;0.975;1" dur="16s" repeatCount="indefinite"/></text>
    </g>

    <!-- Summary -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.475;0.4875;0.95;0.975;1" dur="16s" repeatCount="indefinite"/>
      <line x1="608" y1="356" x2="740" y2="356" stroke="#4ec27a" stroke-width="1.5"/>
      <text x="860" y="361" text-anchor="middle" fill="#4ec27a" font-weight="700">6 passed in 0.42s</text>
      <line x1="980" y1="356" x2="1112" y2="356" stroke="#4ec27a" stroke-width="1.5"/>
    </g>

    <!-- Prompt and cursor -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5125;0.95;0.975;1" dur="16s" repeatCount="indefinite"/>
      <text x="608" y="400" fill="#df4b55">$</text>
      <rect x="626" y="387" width="9" height="16" fill="#e9e4d8">
        <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
